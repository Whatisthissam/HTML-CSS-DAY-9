<!DOCTYPE html>
<html>

<head>
    <title> Task

    </title>
    <style>
        body{
            background-color: black;
        }
        .section {
            padding: 10px;
            margin: 0px;
            border: 10px solid #ccc;
        }

        .box {
            width: 100px;
            height: 100px;
            animation: colorChange 5s;
            animation-duration: 10s;
        }

        @keyframes colorChange {
            from {
                background-color: red;
            }

            to {
                background-color: yellow;
            }
        }

        .multi {
            width: 100px;
            height: 100px;
            position: relative;
            animation: moveColor 5s forwards;
        }

        @keyframes moveColor {
            0% {
                left: 0;
                background: red;
            }

            25% {
                left: 50px;
                background: orange;
            }

            50% {
                left: 100px;
                background: yellow;
            }

            100% {
                left: 200px;
                background: green;
            }
        }

        .pulse {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: blue;
            animation: pulseAnim 1s infinite alternate;
        }

        @keyframes pulseAnim {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>
    <section class="section">
        <div class="box">
            <h1 style="text-align: center; font-size: 20px;">This is color changing box</h1>
        </div>
    </section>

    <section class="section">
        <div class="multi">
            <h1 style="color: aliceblue; font-size: 10px; padding: 10px; justify-content: center;" class="h1box"> This
                is moving color box</h1>
        </div>
    </section>


    <section class="section">
        <div class="pulse" style="text-align: center; justify-content: center; display: flex;">
            <h1 style="color: aliceblue; font-size: 10px; padding: 10px; justify-content: center;" class="h1box"> This
                is moving color box</h1>
        </div>
    </section>






</body>

</html>
