<!DOCTYPE html>
<html lang="en">

<head>
  <title>Task 3</title>

  <style>
    body{
      background-color: rgba(209, 195, 195, 0.583);
    }
    .section {
      padding: 10px;
      margin: 10px;
      border: 5px solid #8e38388d;
      border-radius: 10px;
    }

    .hover-btn:hover {
      background-color: lightgreen;
    }

    input:focus {
      border: 2px solid royalblue;
      outline: none;
    }

    li:first-child {
      color: red;
    }

    h2::before {
      content: "🔹"
    }

    p::first-letter {
      font-size: 200%;
      color: darkorange;
    }

    li::marker {
      content: "➤ ";
      color: purple;
    }

    .shine-btn {
      position: relative;
      padding: 12px 30px;
      background: #3498db;
      color: white;
      border: none;
      overflow: hidden;
      font-size: 16px;
    }

    .shine-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      transform: skewX(-20deg);
    }

    .shine-btn:hover::after {
      animation: slide-shine 0.75s linear forwards;
    }

    @keyframes slide-shine {
      to {
        left: 125%;
      }
    }
  </style>


</head>

<body>

  <section class="section">
  <button class="hover-btn">Hover Me</button>
</section>


<section class="section">
  <input type="text" placeholder="Focus me">
</section>


<section class="section">
  <ul>
    <li>First item</li>
    <li>Second item</li>
  </ul>
</section>

<section class="section">
  <h2>Introduction</h2>
</section>


<section class="section">
  <p>Learning CSS is fun and powerful.</p>
</section>

<section class="section">
  <ul>
    <li>HTML</li>
    <li>CSS</li>
  </ul>
</section>

<section class="section">

  <button class="shine-btn" style="border-radius: 20px;">Click Me</button>

</section>

</body>

</html>
